<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Analytics API Tester</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background: #000;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }

    button:hover {
      background: #333;
    }

    pre {
      margin-top: 20px;
      background: #eee;
      padding: 15px;
      overflow: auto;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">

  <h2>Search Analytics API Tester</h2>

  <label>Search Term</label>
  <input
    id="searchTerm"
    placeholder="birthday decoration"
  >

  <label>Clicked Item ID</label>
  <input
    id="clickedItemId"
    placeholder="686f4dfd74f2e2f6d4..."
  >

  <label>Clicked Title</label>
  <input
    id="clickedTitle"
    placeholder="Jungle Theme"
  >

  <label>Clicked Type</label>
  <select id="clickedType">
    <option value="">Select</option>
    <option value="theme">Theme</option>
    <option value="product">Product</option>
    <option value="category">Category</option>
  </select>

  <label>User ID</label>
  <input
    id="userId"
    placeholder="670cafda63f0548f592bf2f2"
  >

  <label>Visitor ID</label>
  <input
    id="visitorId"
    placeholder="b4c4c4c4-056d-4824-b38b-8f4cc719dc68"
  >

  <button onclick="submitAnalytics()">
    Save Analytics
  </button>

  <pre id="result"></pre>

</div>

<script>

const API_URL = "http://localhost:5000/api/search-tracking"; // <-- Change API URL

async function submitAnalytics() {

    const body = {
        searchTerm: document.getElementById("searchTerm").value.trim(),
        clickedItemId: document.getElementById("clickedItemId").value.trim(),
        clickedTitle: document.getElementById("clickedTitle").value.trim(),
        clickedType: document.getElementById("clickedType").value,
        userId: document.getElementById("userId").value.trim(),
        visitorId: document.getElementById("visitorId").value.trim(),
    };

    Object.keys(body).forEach(key => {
        if(body[key] === ""){
            delete body[key];
        }
    });

    try{

        const response = await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(body)
        });

        const data = await response.json();

        document.getElementById("result").textContent =
            JSON.stringify(data,null,2);

    }catch(err){

        document.getElementById("result").textContent =
            err.message;

    }

}

</script>

</body>
</html>
